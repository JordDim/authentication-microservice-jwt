openapi: 3.0.3
info:
  title: authentication-microservice-jwt
  description: |-
    Application responsible for registering users and logging in with JWT.
  termsOfService: http://swagger.io/terms/
  contact:
    email: apiteam@swagger.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.11
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:8086/api/v1
    description: Local server

tags:
  - name: auth
    description: Controller for user authentication.

paths:
  /auth/register:
    post:
      tags:
        - auth
      summary: Register a new account
      description: Create a new user account
      operationId: registerAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Invalid input
        '409':
          description: User already exists
        '500':
          description: Internal Server Error

  /auth/login:
    post:
      tags:
        - auth
      summary: Login a user
      description: Authenticate a user account and return a token
      operationId: loginAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
        '500':
          description: Internal Server Error

components:
  schemas:
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          example: user123
        password:
          type: string
          example: securePassword
        email:
          type: string
          example: user@example.com
        role:
          type: string
          description: User role, either ADMIN or USER
          example: USER

    RegisterResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: user123
        email:
          type: string
          example: user@example.com
        role:
          type: string
          description: User role assigned
          example: USER

    LoginRequest:
      type: object
      properties:
        username:
          type: string
          example: user123
        password:
          type: string
          example: securePassword

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 404
          description: "Código de estado HTTP que indica el tipo de error."
        message:
          type: string
          example: "Error message"
          description: "Mensaje descriptivo del error que proporciona más detalles."
        details:
          type: string
          example: "Additional error details."
          description: "Información adicional o detalles sobre el error (opcional)."
